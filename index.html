{key:'stage',q:'先告诉我，年轻人。你是独自摸索，还是已经有同伴同行？',choices:[['alone','主要还是一个人'],['loose','有一些联系，但不够稳定'],['stable','已经有固定的小团体'],['working','已有相对明确的分工与持续工作']],reply:{alone:'独自一人走在路上，难免会感到孤单。不过，思想可以在一个人的书桌上开始生长。',loose:'啊，已经有了同伴！哪怕彼此尚未习惯协作，也算是一段关系的开始。',stable:'一个能够持续合作的小集体，这可是珍贵的基础。我们还得看看它是否运转得顺畅。',working:'听起来你们已经积累了一些协作经验。可是不要急，我们要问问它是否能长期维持。'}},
{key:'time',q:'你能稳定拿出来投入实践的时间，多吗？',choices:[['low','很少，只能零碎投入'],['mid','每周能稳定拿出一些时间'],['high','时间比较充足']],reply:{low:'噢，我理解的，生活对大多数人来说都不容易。即使如此，你仍来到这里，思考这个世界的未来。如果你愿意从宝贵的闲暇中分出一点时间，我也要郑重地向你致敬！',mid:'啊！你拥有一些可以稳定支配的时间。这可是一笔宝贵的财富。可是时间不会自己变成成果。',high:'真是令人羡慕的条件！不过，时间充足并不意味着必须把每一分钟都填满。'}},
{key:'obstacle',q:'现在最令你困惑的，是什么呢？',choices:[['direction','不知道从哪里开始'],['coord','大家有心做事，却难以协调'],['knowledge','想做点事，却缺少知识或材料'],['retention','做了不少事情，却难以留下成果']],reply:{direction:'找不到开端，不等于缺乏方向感。我们可以把一个巨大的问题，拆成一个很小的研究问题。',coord:'噢！原来是齿轮没有咬合好。容我说一句机械方面的行话：再大的发动机，也需要合适的传动机构。',knowledge:'知识的不足可以弥补，但我们应先辨认：究竟缺少哪些知识？',retention:'啊！成果从手中溜走，像发条一圈圈松开。也许我们需要一个能把经验保存下来的机构。'}},
{key:'skill',q:'那么，你觉得自己较容易上手的是哪一类事情？',choices:[['write','阅读、写作、翻译与编辑'],['tech','设计、技术与工具制作'],['research','查资料、比较观点与分析'],['coord','沟通、协调与维护工作流程'],['unsure','暂时还不确定']],reply:{write:'文字是很好的工具！但也请记住，文字只有被阅读、理解和利用，才可能产生更长久的效果。',tech:'咔哒！你也对机器感兴趣？多么令人愉快。但技术终究是服务于人的。',research:'你愿意钻研问题。很好！不过一份研究最后如何被使用，也同样值得研究。',coord:'啊，能让大家更好地共同工作，这也是一种不可忽视的能力。',unsure:'不知道也没关系！人往往是在尝试过程中，才发现自己能做些什么。'}}
];

function aud(kind='gear'){if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;window.__mCtx=window.__mCtx||new C;const ctx=window.__mCtx,t=ctx.currentTime,notes=kind==='gear'?[230,180,150]:[440,550,720];notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='gear'?'triangle':'sine';o.frequency.setValueAtTime(f,t+i*.09);o.frequency.exponentialRampToValueAtTime(f*.7,t+i*.09+.11);g.gain.setValueAtTime(.00001,t+i*.09);g.gain.exponentialRampToValueAtTime(kind==='gear'?.038:.024,t+i*.09+.014);g.gain.exponentialRampToValueAtTime(.00001,t+i*.09+.14);o.connect(g).connect(ctx.destination);o.start(t+i*.09);o.stop(t+i*.09+.15);});}catch(e){/* optional sound */}}

function home(){return `<section class="screen center"><div class="eyebrow p-25">一个关于实践与困惑的机械梦境</div><div class="hero"><span class="orb" style="left:17%;top:11%"></span><span class="orb" style="right:17%;top:15%"></span><div class="hero-icon">${puppet()}</div></div><h1>梦见马克思</h1><p class="quote">“年轻的朋友……我听见你有些困惑。”</p><p class="muted center-lead">与一位咔哒作响的机械导师谈谈你的处境。<br>他不一定知道答案，但他愿意认真听你说。</p><div class="actions"><button class="btn" data-action="avatar">制作梦中的自己 →</button></div><div class="divider">第一场梦 · 原型实验</div><p class="small">这是一段没有 AI 的分支对话。所有角色台词均为虚构，不是马克思的历史引文。</p></section>`;}

function progress(){return `<div class="steps">梦中问答 ${Math.min(state.q+1,4)} / 4</div><div class="progress"><i style="width:${Math.min(state.q/4*100,100)}%"></i></div>`;}
function historyView(){return state.history.length?`<div class="history" aria-label="已经进行的对话">${state.history.map(x=>`<div>${state.avatar?`<img class="you-avatar" src="${state.avatar}" alt="你的梦中头像">`:''}<span>你：${esc(x)}</span></div>`).join('')}</div>`:'';}
function question(){const q=questions[state.q];return `<section class="screen"><div class="eyebrow">第二幕 · 发问</div><h2>请告诉我……</h2>${progress()}<div class="portrait-row"><div class="portrait">${marxSVG}</div><div class="speech"><strong>机械马克思 · 发条运转正常</strong><p>${esc(q.q)}</p></div></div>${historyView()}<div class="divider">选择你的回答</div>${q.choices.map(([id,v])=>`<button class="choice" data-choice="${id}">${esc(v)}</button>`).join('')}<p class="small">想不出精准的答案也没关系，选最接近的那一项即可。</p></section>`;}
function respond(){const last=state.q>=questions.length-1;return `<section class="screen"><div class="eyebrow">第二幕 · 回响</div><h2>齿轮思考了一会儿</h2>${progress()}<div class="figure-small">${puppet('thinking')}</div><div class="reply"><p class="book-label">咔哒……咔哒……咚！</p><p class="frozen">“${esc(state.reply)}”</p></div><button class="btn full" data-action="${last?'result':'next'}">${last?'听听他的建议 →':'继续听他发问 →'}</button></section>`;}
function makeResult(){const a=state.answers;const group=a.stage!=='alone';let primary,desc,front,output,accum,secondary;switch(a.obstacle){case'coord':primary='把合作变成可持续的工作';desc=group?'先建立小规模、可重复的分工与复盘方式，减少“大家都想做，却没人能接续”的困境。':'先把零散联系和个人任务整理成清晰的小步骤，暂不急于扩大合作规模。';front='组织再生产';output='明确的任务记录与复盘习惯';accum='有机会形成可复用的协作能力';break;case'knowledge':primary='制作一份小型学习与资料地图';desc='从一个具体问题开始，收集并核查材料，而不是无止境地积攒信息。';front='理论研究';output='主题索引与共享资料';accum='有机会形成持续的学习与研究能力';break;case'retention':primary='让已经完成的成果留下来';desc='为文字、经验和讨论建立简单的归档、复用与反馈机制。';front='组织再生产／理论研究';output='可检索、可复用的成果档案';accum='经验不再只留在个人记忆中';break;default:primary='从一个具体问题出发';desc='选一个可以被清楚描述、能形成小成果的问题，尝试一次完整的研究—产出—回顾过程。';front='理论研究／意识形态工作';output='小型专题记录或学习材料';accum='有机会形成连续的实践方向';}
const skillNames={write:'文字、翻译与编辑',tech:'技术与设计',research:'资料研究与分析',coord:'组织协作',unsure:'探索与尝试'};secondary=a.skill==='tech'?'你还可以尝试制作轻量工具或资料目录。':a.skill==='write'?'你还可以将过程整理成可阅读、可传播的文字材料。':a.skill==='coord'?'你还可以尝试承担一次简单的协作协调工作。':a.skill==='research'?'你还可以将分歧或疑问写成一个短研究课题。':'不妨选一项低门槛的小任务，借此发现自己的兴趣和能力。';let scope=a.time==='low'?'尽量保持极小的规模；哪怕每周只完成一个小步骤也可以。':a.time==='high'?'即使时间较充足，也建议先检验持续性，而不是一次铺开很多项目。':'选择每周能够稳定交付的小项目，比偶尔冲刺更容易积累经验。';return {primary,desc,front,output,accum,secondary,scope,skill:skillNames[a.skill||'unsure']};}
function result(){const r=makeResult();return `<section class="screen"><div class="eyebrow">第三幕 · 梦中回答</div><h2>“我有一个不成熟的想法……”</h2><div class="portrait-row"><div class="portrait">${marxSVG}</div><div class="speech"><strong>机械马克思</strong><p>“根据你说的这些，我想，你可以先从一件小事开始。不是因为它无比伟大，而是因为它可能真的做得成。”</p></div></div><div class="panel" style="margin-top:18px"><div class="book-label">可能的方向 · 仅供探索</div><h2 class="result-title">${esc(r.primary)}</h2><p>${esc(r.desc)}</p><div class="chips"><span class="tag">你的能力：${esc(r.skill)}</span><span class="tag">${state.answers.time==='low'?'时间有限':state.answers.time==='high'?'时间充足':'时间相对稳定'}</span></div><div class="note">${esc(r.scope)}</div><div class="feature"><span class="num">01</span><div><strong>关联战线</strong><br>${esc(r.front)}</div></div><div class="feature"><span class="num">02</span><div><strong>可能的直接成果</strong><br>${esc(r.output)}</div></div><div class="feature" style="border-bottom:0"><span class="num">03</span><div><strong>在适当条件下的力量积累</strong><br>${esc(r.accum)}</div></div><p class="small">${esc(r.secondary)}</p></div><p class="quote center" style="margin:26px 0">“我并不知道你的全部处境。所以请不要把我的话当成命令。你比这台旧机器更懂得自己的生活。”</p><button class="btn full" data-action="panorama">从梦中醒来，展开全景图 →</button></section>`;}
function detailsForNode(key,r){const env=state.env;const map={position:'你的个人条件与主体状态，决定了什么工作比较容易开始。它们不是对你个人价值的评判。',work:'工作是实践的具体形式。这里推荐的是一种可尝试的方向，而非唯一正确答案。',front:`这类工作可能关联“${r.front}”等战线。但工作与战线之间并非严格的一对一关系。`,output:`可能形成：${r.output}。做了工作不意味着成果必定产生。`,accum:`${r.accum}。成果需要被保存、吸收、复用，才可能逐渐形成更持久的能力。`,env:env==='default'?'当前使用的是一个简化的当代中国默认情境。真实环境很复杂，无法只凭一个标签作完整判断。':'在“公开传播条件更充足”的反事实设定中，同一成果可能更容易通过公开交流获得反馈；但传播能力和效果依然受到其他条件影响。'};return map[key]||map.position;}
function panorama(){const r=makeResult(),isAlt=state.env==='open';return `<section class="screen"><div class="eyebrow">第四幕 · 醒来之后</div><h2>一张逐渐展开的全景图</h2><p class="muted">机械声停下了。宏伟的神殿折叠成纸板，露出后面的线路和概念。点按节点，看看它们怎样彼此关联。</p><div class="panel"><div class="graph"><button class="g-node ${state.selectedNode==='position'?'current':''}" data-node="position"><b>你的处境</b><span>个人条件 · 能力 · 主体状态</span></button><div class="g-line"></div><button class="g-node ${state.selectedNode==='work'?'current':''}" data-node="work"><b>${esc(r.primary)}</b><span>可能开展的工作</span></button><div class="g-line"></div><button class="g-node ${state.selectedNode==='front'?'current':''}" data-node="front"><b>${esc(r.front)}</b><span>关联战线</span></button><div class="g-line"></div><button class="g-node ${state.selectedNode==='output'?'current':''}" data-node="output"><b>${esc(r.output)}</b><span>可能产出的成果</span></button><div class="g-line"></div><button class="g-node ${state.selectedNode==='accum'?'current':''}" data-node="accum"><b>${esc(r.accum)}</b><span>可能的长期积累</span></button></div><div class="g-detail">${esc(detailsForNode(state.selectedNode,r))}</div></div><div class="divider">如果社会环境改变呢？</div><p class="small">固定你的其他回答，只改变一项假设条件，观察判断依据如何发生变化。</p><div class="compare"><button data-env="default" class="${state.env==='default'?'active':''}">默认情境：当代中国（简化）</button><button data-env="open" class="${state.env==='open'?'active':''}">假设：公开传播渠道更充足</button></div><div class="note"><b>${isAlt?'假设情境：':'默认情境：'}</b> ${isAlt?'公开分享和反馈可能变得更可行；同一份资料除了被保存，也可能更容易进入讨论与传播。但这并不自动改变个人的时间或能力。':'不把公开传播的条件视为无限充分；先重视成果能否完成、保存与复用。不同具体领域仍需单独分析。'}</div><p class="small" style="margin-top:12px">这是教学用的反事实对照，不是对具体社会现实的量化评价。</p><div class="actions"><button class="btn secondary" data-action="result">返回导师建议</button><button class="btn" data-action="restart">带着问题再入梦 ↺</button></div><p class="end">“从现在起，不必相信一台机器。<br>去观察现实，去理解条件，然后自己思考。”</p></section>`;}
function render(){app.innerHTML=state.screen==='home'?home():state.screen==='avatar'?avatar():state.screen==='intro'?intro():state.screen==='question'?question():state.screen==='respond'?respond():state.screen==='result'?result():panorama();if(state.screen==='avatar')installCanvas();}
const answerText=(q,id)=>q.choices.find(o=>o[0]===id)?.[1]||'';
app.addEventListener('click',e=>{const c=e.target.closest('[data-choice]');if(c){const q=questions[state.q],id=c.dataset.choice;state.answers[q.key]=id;state.reply=q.reply[id];state.history.push(answerText(q,id));aud('gear');setScreen('respond');return;}
const n=e.target.closest('[data-node]');if(n){state.selectedNode=n.dataset.node;render();return;}const env=e.target.closest('[data-env]');if(env){state.env=env.dataset.env;state.selectedNode='env';aud('bell');render();return;}const col=e.target.closest('[data-color]');if(col){state.color=col.dataset.color;document.querySelectorAll('.swatch').forEach(el=>el.classList.toggle('active',el.dataset.color===state.color));return;}
const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'avatar':setScreen('avatar');break;case'dream':{const canvas=document.getElementById('paint');if(canvas)state.avatar=canvas.toDataURL('image/png');aud('bell');setScreen('intro');break;}case'skipAvatar':state.avatar=null;aud('bell');setScreen('intro');break;case'question':setScreen('question');break;case'next':state.q++;aud('gear');setScreen('question');break;case'result':setScreen('result');break;case'panorama':aud('bell');setScreen('panorama');break;case'restart':state.q=0;state.history=[];state.answers={};state.env='default';state.selectedNode='position';setScreen('home');break;case'clear':drawBase(document.getElementById('paint'));break;case'eraser':state.color='#e5d1b4';document.querySelectorAll('.swatch').forEach(el=>el.classList.remove('active'));break;}});
document.getElementById('sound').addEventListener('click',e=>{state.sound=!state.sound;e.currentTarget.textContent=state.sound?'♪':'♫';e.currentTarget.setAttribute('aria-label',state.sound?'关闭音效':'开启音效');if(state.sound)aud('bell');});document.getElementById('reset').addEventListener('click',()=>{state.q=0;state.history=[];state.answers={};state.avatar=null;state.env='default';state.selectedNode='position';setScreen('home');});
function drawBase(can,img){if(!can)return;const c=can.getContext('2d');c.clearRect(0,0,320,360);c.fillStyle='#e5d1b4';c.fillRect(0,0,320,360);if(img){const r=Math.max(320/img.width,360/img.height),w=img.width*r,h=img.height*r;c.drawImage(img,(320-w)/2,(360-h)/2,w,h);return;}c.fillStyle='#755e5a';c.beginPath();c.moveTo(30,356);c.quadraticCurveTo(35,240,121,235);c.lineTo(198,235);c.quadraticCurveTo(285,241,290,356);c.fill();c.fillStyle='#f0d3ab';c.beginPath();c.ellipse(160,160,87,107,0,0,Math.PI*2);c.fill();c.strokeStyle='#6b4836';c.lineWidth=5;c.stroke();c.fillStyle='#61433d';c.beginPath();c.moveTo(70,145);c.quadraticCurveTo(41,61,116,58);c.quadraticCurveTo(194,16,253,92);c.lineTo(247,128);c.quadraticCurveTo(201,104,173,88);c.quadraticCurveTo(120,143,70,145);c.fill();c.fillStyle='#3d3533';c.beginPath();c.arc(130,175,5,0,Math.PI*2);c.arc(190,175,5,0,Math.PI*2);c.fill();c.beginPath();c.moveTo(142,212);c.quadraticCurveTo(160,227,180,211);c.strokeStyle='#8d5e51';c.lineWidth=3;c.stroke();c.fillStyle='#af5149';c.fillRect(139,275,42,76);c.fillStyle='#f6ead6';c.beginPath();c.moveTo(117,242);c.lineTo(160,290);c.lineTo(204,244);c.lineTo(186,256);c.lineTo(160,276);c.lineTo(132,256);c.fill();}
function installCanvas(){const can=document.getElementById('paint'),ctx=can.getContext('2d');drawBase(can);let down=false,last=null;function point(e){const r=can.getBoundingClientRect();return {x:(e.clientX-r.left)*320/r.width,y:(e.clientY-r.top)*360/r.height};}can.addEventListener('pointerdown',e=>{down=true;can.setPointerCapture(e.pointerId);last=point(e);});can.addEventListener('pointermove',e=>{if(!down)return;const p=point(e);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=state.color;ctx.lineWidth=state.thickness;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});for(const event of ['pointerup','pointercancel','lostpointercapture'])can.addEventListener(event,()=>down=false);document.getElementById('upload').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file||!file.type.startsWith('image/'))return;if(file.size>12*1024*1024){alert('请使用小于 12 MB 的图片。');return;}const u=URL.createObjectURL(file),im=new Image;im.onload=()=>{drawBase(can,im);URL.revokeObjectURL(u);};im.onerror=()=>{URL.revokeObjectURL(u);alert('无法读取图片');};im.src=u;});}
render();})();
</script>
</body></html>
