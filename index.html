{key:'pressure',label:'现实限制',q:'我还想问得更直截了当一些。\n\n警察追你们紧不紧？',opts:[['light','几乎没感到这方面的压力'],['some','有一些限制与干预'],['high','压力相当明显'],['very','十分严格，公开活动可能面临风险'],['unknown','不清楚／不愿回答']],replies:{light:'那是一个重要的条件，但别急着把它当成全部答案。没有警察敲门，并不保证一切事情就会顺利。',some:'嗯。我记下的是一种概括的处境，而不是要你说出任何人的名字。',high:'明白。请别向我透露具体人员、地点或行动。我们讨论的是理论条件，不是审讯记录。',very:'这使得我们更应谨慎地谈论现实。我可不希望你为了回答一个梦里的老人而承担不必要的风险。',unknown:'不愿回答？完全可以。一个人甚至有权拒绝回答马克思的问题——尽管这会令马克思略感失落。'}},
{key:'group',label:'同行者',q:'那么，你是独自摸索，还是已经有了同伴？',opts:[['alone','主要还是一个人'],['loose','有一些联系，但还不够稳定'],['stable','有能够持续交流的小团体'],['organised','已经有分工和持续协作']],replies:{alone:'独自一人？那你可得多照顾好自己的头脑。一切思想都需要呼吸。',loose:'啊，已经有了同伴！这很好。但一群人的热情和能够持续合作，还不是同一件事。',stable:'稳定的小团体是一种值得珍惜的条件。我甚至想为它举杯——不过我们先看看它在做什么。',organised:'你们已有分工。很好！现在请允许我问一句令人扫兴的话：这些分工能持续多久？'}},
{key:'time',label:'闲暇',q:'你能稳定拿出来投入实践的时间，多吗？',opts:[['low','很少，只能零碎投入'],['mid','每周能稳定拿出一些时间'],['high','时间比较充足'],['unstable','时多时少，很不稳定']],replies:{low:'很少？嗯……历史留给你的空闲似乎不多。\n\n不过，你还是来了。很好！一个每周只有两小时的人类，仍然有权过问世界。',mid:'你拥有一些能够稳定支配的时间。让我郑重宣布：这比一百次没有兑现的宏伟计划更有用。',high:'相当充足！很好。但请不要立刻把全部时间交给我的建议。我可不负责为你补觉。',unstable:'时多时少。这样的生活并不罕见。一个计划如果只有在完美的一周才能成立，那它多半需要重新计划。'}},

{key:'interests',label:'兴趣',multi:true,max:5,q:'这些工作当中，哪些让你想了解或尝试？\n\n别担心，我并不会在你选择之后立刻委任你为某个委员会的主席。',opts:WORKS.map(w=>[w[0],w[1],w[2]]),replies:{default:'非常好。兴趣不代表义务，而是我们继续探索的一个入口。'}},
{key:'obstacle',label:'困惑',q:'最后一个问题。\n\n眼下最让你为难的是什么？',opts:[['direction','不知道从哪里开始'],['knowledge','缺少知识、材料或经验'],['coord','有想法，但协作难以持续'],['retention','做了事，却不容易留下成果'],['energy','精力不足，容易疲惫'],['uncertain','我仍然不确定']],replies:{direction:'不知道从何开始？这很常见。世界很大，一张纸却很小。我们也许先从纸上一个能写完的问题开始。',knowledge:'那么，我们先辨认缺少什么，而不是给自己安排一座永远读不完的图书馆。',coord:'一群人有相同愿望，却不意味着他们会自动拥有共同的方法。这值得认真研究。',retention:'成果没有留下来！这就像写完一整本书，第二天却找不到书桌。我们应当谈谈保存与复用。',energy:'你累了。那就更不能把疲惫当成罪过。历史已经够沉重了，不需要再由一个年轻人的肩膀独自承担。',uncertain:'仍然不确定？好极了！我也有很多没有解决的问题。若一个梦里的人全都知道答案，那你最好立刻醒来。'}}

const stage=(mode='')=>`<div class="stage ${mode}"><div class="stage-bolts"><span></span><span></span></div><div class="stage-label">THE THEATRE OF HISTORY</div><div class="halo" aria-hidden="true"></div><div class="stage-head"><div class="puppet-frame"><img src="assets/marx-puppet.webp" alt="由粘土、布料和羊毛制成的经典大胡子马克思人偶"></div><div class="plinth"></div></div></div>`;

function home(){return `<section class="screen center welcome-hero"><div class="eyebrow">一场关于革命实践的机械梦</div><h1 class="big-title">梦见马克思</h1><p class="subtitle">Dream of Marx · 第一场梦</p>${stage()}<p class="quote">“年轻的朋友……你有什么困惑？”</p><p class="small">一位在梦里认真发问的马克思，和一台正在等待转动的黄铜选择器。</p><button class="primary-btn full" data-act="avatar">先画出梦中的自己　↗</button><div class="home-deco">粘土人偶剧 · 旋转铜牌 · 分支对话 · 无 AI API</div><p class="footnote">历史人物的全部台词都是艺术虚构，不是历史引文。问答仅用于理论学习与探索。</p></section>`}
function avatarScreen(){return `<section class="screen avatarlab"><div class="section-kicker">序幕 · 一位年轻人的自画像</div><h2 class="subheading center">给梦中的自己画几笔</h2><p class="small center">这不是绘画考试。只用几条线也可以。你画成什么样，都不会改变理论结果。</p><div class="avatar-card"><div class="avatar-drawing"><canvas id="sketch" width="300" height="300" aria-label="在简笔小人上用手指涂鸦"></canvas></div><div class="color-controls">${['#512e2d','#aa4e39','#c18945','#526e63','#f5e8ce','#4b507a'].map(c=>`<button class="swatch ${state.color===c?'active':''}" data-color="${c}" style="background:${c}" aria-label="选择画笔颜色"></button>`).join('')}</div><div class="avatar-tools"><button class="tiny-btn" data-act="undo">↶ 撤销</button><button class="tiny-btn" data-act="erase">橡皮</button><button class="tiny-btn" data-act="resetSketch">⟳ 重新画</button></div></div><label class="entry-field">你叫“……”<input id="avatar-name" type="text" maxlength="32" autocomplete="off" value="${safe(state.name)}" placeholder="可以是名字、外号、代号"></label><label class="entry-field">你是一名“……”<input id="avatar-role" type="text" maxlength="52" autocomplete="off" value="${safe(state.role)}" placeholder="学生、诗人、一只会写诗的猫……"></label><p class="footnote" style="margin-top:9px">不必填写真实身份；两项都可留空。画作与文字只在当前页面内使用，不会上传。</p><button class="primary-btn full" data-act="finishAvatar">完成自我介绍，入梦 →</button><button class="secondary-btn full" data-act="skipAvatar">跳过绘画，直接入梦</button></section>`}
function intro(){let introline=state.name||state.role?`啊，${nameOf()}！${state.role?`你说你是一名${state.role}。`:''}`:'啊，年轻的朋友！';return `<section class="screen"><div class="section-kicker">第一幕 · 云雾中的来访者</div>${stage('talking')}<div class="panel story-box"><p>夜已深了。你伏在桌上睡去。</p><p>雾气中，一位蓄着白色大胡子的老人缓缓转过身来。远处传来几声沉重的齿轮响。</p><p><em>马克思：</em>“${safe(introline)}”</p><p>“很好。关于你，我还有许多问题。”</p><p><em>（他十分郑重地整理了衣领。）</em></p><p>“不过在谈论你之前，先让我问问这个世界。”</p><button class="primary-btn full" data-act="begin">开始梦中问答 →</button></div>${footer()}</section>`}
function qScreen(){const q=Q[state.q],reply=state.replyReady;return `<section class="screen"><div class="quest-head"><span>第 ${state.q+1} / ${Q.length} 问　· ${safe(q.label)}</span><span>${reply?'导师正在回应':'倾听与选择'}</span></div><div class="rail"><i style="width:${Math.round((state.q+1)/Q.length*100)}%"></i></div>${stage(reply?'talking':'')}
<div class="parchment marx-speech"><div class="speech-name"><span>卡尔·马克思</span><span class="gear-mark" aria-hidden="true">⚙</span></div><div class="speech-text">${safe(reply?state.feedback:q.q)}</div><div class="speech-stage">${reply?'（他认真地思考自己刚才说的话。）':'（他望着你，等待回答。）'}</div></div>
${reply?`<div class="dialogue-feedback"><div class="voice-note">☷ 你刚才的回答已经记录在这场梦里</div><p>${safe(state.lastAnswerText)}</p></div><button class="primary-btn full reply-btn" data-act="advance">${state.q===Q.length-1?'听听他的想法 →':'继续提问 →'}</button>`:selector(q)}
${footer()}<p class="miniremark">这是一场虚构的理论问答。不要填写能识别他人的信息。</p></section>`}
function currentOptions(q){const cats=q.multi?['all',...new Set(q.opts.map(o=>o[2]))]:['all'];const opts=q.multi&&state.category!=='all'?q.opts.filter(o=>o[2]===state.category):q.opts;return{opts,cats}}
function selector(q){const {opts,cats}=currentOptions(q);if(state.cursor>=opts.length)state.cursor=0;const idx=state.cursor;const previous=opts[(idx+opts.length-1)%opts.length];const current=opts[idx];const next=opts[(idx+1)%opts.length];const selected=state.selectedMulti[q.key]||[];const makePlate=(v,pos)=>`<button class="brass-plate ${pos==='center'?'active':''} ${selected.includes(v[0])?'selected':''} ${pos!=='center'?'neighbor':''}" data-opt="${safe(v[0])}" data-pos="${pos}" title="${safe(v[1])}">${selected.includes(v[0])?'✓ ':''}${safe(v[1])}</button>`;return `<div class="caption">✧ ${q.multi?'转动铜轮，选择你想记录的选项':'转动铜轮，按下你的回答'} ✧</div><div class="selector-housing"><div class="selector-title">THE MECHANICAL CHOICE ENGINE</div>${q.multi?`<div class="category-rail" aria-label="选项分类">${cats.map(cat=>`<button data-category="${safe(cat)}" class="${state.category===cat?'current':''}">${cat==='all'?'全部':safe(cat)}</button>`).join('')}</div>`:''}<div class="selector-controls"><button class="wheel-button" data-rot="-1" aria-label="向前转动选项">‹</button><div class="drum-window"><div class="drum-cards ${state.rolling?'rolling':state.animateEnter?'entering':''}" aria-label="旋转式机械选项">${makePlate(previous,'prev')}${makePlate(current,'center')}${makePlate(next,'next')}</div></div><button class="wheel-button" data-rot="1" aria-label="向后转动选项">›</button></div><div class="wheel-screws"><span>⚙</span><span>✦ ${idx+1} / ${opts.length} ✦</span><span>⚙</span></div></div><div class="selector-footer">${q.multi?'可多选，按下铜牌锁定；再拉动确认杆':'点击任意铜牌选择答案 · 或按两侧按钮旋转'}</div>${q.multi?`<div class="selected-tags">${selected.length?selected.map(id=>`<span class="tag">${safe(q.opts.find(o=>o[0]===id)?.[1]||id)}</span>`).join(''):'<span class="small">尚未选择 · 可直接跳过</span>'}</div><div class="action-row"><button class="secondary-btn" data-act="skipMulti">不确定／跳过</button><button class="primary-btn" data-act="confirmMulti">拉动确认杆　⚙ (${selected.length}${q.max?'/'+q.max:''})</button></div>`:''}`}
function reaction(q,value){if(q.multi){const arr=state.selectedMulti[q.key]||[];if(q.key==='skills')return arr.length?`我记下了你选择的${arr.length}项能力。很好！不过有本领是一回事，有条件去做是另一回事。`:'不知道自己擅长什么？这也是值得如实说出的答案。';return arr.length?`你挑选了${arr.length}类想了解的工作。别担心，我并不会因此任命你为委员会主席。`:'没选也没关系。有些兴趣需要在实践中才会出现。'}return q.replies[value]||'我明白了。让我们再问一个问题。'}
function answer(id){const q=Q[state.q];if(q.multi){const selected=state.selectedMulti[q.key]||[];const isSelected=selected.includes(id);if(isSelected)state.selectedMulti[q.key]=selected.filter(v=>v!==id);else if(selected.length<(q.max||8))state.selectedMulti[q.key]=[...selected,id];else{alert(`最多可选择 ${q.max||8} 项。`);return;}sound('lock');draw();return;}const item=q.opts.find(o=>o[0]===id);if(!item)return;state.answers[q.key]=id;state.lastAnswerText=item[1];state.feedback=reaction(q,id);state.replyReady=true;sound('lock');draw()}
function finishMulti(skip=false){const q=Q[state.q];const vals=skip?[]:state.selectedMulti[q.key]||[];state.answers[q.key]=vals;state.lastAnswerText=vals.length?vals.map(id=>q.opts.find(o=>o[0]===id)?.[1]||id).join('、'):'目前还不确定';state.feedback=reaction(q);state.replyReady=true;sound('lock');draw()}
function rotate(step){if(state.rolling||state.replyReady)return;const q=Q[state.q],o=currentOptions(q).opts;if(o.length<2)return;state.rolling=true;draw();sound();setTimeout(()=>{state.cursor=(state.cursor+step+o.length)%o.length;state.rolling=false;draw()},reduced()?1:230)}
function next(){if(state.q===Q.length-1){state.resultChoices=pickWorks();setScreen('result');sound('bell')}else{state.q++;state.category='all';state.cursor=0;state.replyReady=false;state.animateEnter=true;setScreen('question');sound();setTimeout(()=>{state.animateEnter=false},reduced()?1:600)}}
function pickWorks(){const liked=state.answers.interests||[],skills=state.answers.skills||[],groups=state.answers.group,time=state.answers.time,obstacle=state.answers.obstacle;const scored=WORKS.map(w=>{let s=0;if(liked.includes(w[0]))s+=10;if(skills.includes(w[6]))s+=3;if(skills.some(id=>w[5]==='文字'&&['write','translate','edit'].includes(id)))s+=1;if(time==='low'&&['study','documents','translation','review','historical'].includes(w[0]))s+=2;if(groups==='alone'&&['study','documents','theory','knowledge'].includes(w[0]))s+=1;if(groups==='organised'&&['workflow','review','knowledge'].includes(w[0]))s+=2;if(obstacle==='retention'&&['review','knowledge','documents'].includes(w[0]))s+=4;if(obstacle==='coord'&&['workflow','discussion'].includes(w[0]))s+=4;if(obstacle==='knowledge'&&['study','documents','historical'].includes(w[0]))s+=4;if(obstacle==='energy'&&['study','review','documents'].includes(w[0]))s+=2;return{w,s}});scored.sort((a,b)=>b.s-a.s||WORKS.indexOf(a.w)-WORKS.indexOf(b.w));const selected=scored.filter(x=>x.s>0).slice(0,3).map(x=>x.w);if(selected.length===0)selected.push(...[WORKS[0],WORKS[1],WORKS[14]]);while(selected.length<3){const w=WORKS.find(x=>!selected.some(y=>y[0]===x[0]));if(!w)break;selected.push(w)}return selected.slice(0,3)}
function envDescription(kind){const id=kind==='same'?state.answers.environment:kind==='open'?'open':'restrict';const pressure=state.answers.pressure;let s={open:'在公共讨论空间较宽广的情境中，成果有更多公开交流与反馈的可能，但仍取决于持续性和资源。',mixed:'在参与机会与限制并存的情境中，工作形式和反馈渠道需要逐项具体分析。',restrict:'在政治表达受到较严格限制的情境中，现实条件更具约束性，不能从能力或意愿直接推出某项活动可行。',crisis:'社会剧烈变化时，工作条件可能迅速改变，不能把静态建议当作长期确定结论。',unknown:'环境未知时，保持判断谦逊，不把未知条件当作已知。',fiction:'假想社会只是用于对照变量的教学情境，不能替代现实研究。'}[id];if(kind==='same'&&['high','very'].includes(pressure))s+=' 你也提到了较高的公共活动压力；这里不会据此推导具体的现实行动方案。';return s}
function summaryLine(){const time={low:'可稳定投入的时间有限',mid:'有一些稳定时间',high:'有较充足时间',unstable:'时间不太稳定'}[state.answers.time]||'时间条件尚不清楚';const group={alone:'主要独立探索',loose:'有零散联系',stable:'有较稳定的同伴',organised:'已有持续分工'}[state.answers.group]||'集体状态尚不清楚';return `据你所说，你目前${group}，${time}。这些条件会影响项目的规模和持续性，却不能替你决定什么工作最值得做。`}
function result(){const picks=state.resultChoices.length?state.resultChoices:pickWorks();return `<section class="screen"><div class="section-kicker">第三幕 · 一份不那么神圣的回答</div>${stage('talking')}<div class="parchment marx-speech"><div class="speech-name">卡尔·马克思 <span>✦</span></div><div class="speech-text">“${safe(nameOf())}，我认真听完了。”\n\n“现在我可以告诉你三个可能的方向。不过，这可不是圣旨——如果我的建议不符合你的生活，请先怀疑我的建议。”</div></div><div class="panel"><h2 class="subheading">你的处境，不是一道选择题</h2><p>${safe(summaryLine())}</p><p class="small">${safe(envDescription('same'))}</p></div><div class="section-kicker">三个值得进一步探索的工作</div>${picks.map((w,i)=>`<div class="result-card"><div class="kicker">方向 ${String(i+1).padStart(2,'0')} · ${safe(w[2])}</div><h3>${safe(w[1])}</h3><p>可能的直接成果：${safe(w[4])}</p><p class="path">关联战线：${safe(w[3])}。成果能否形成长久能力，还取决于保存、共同理解、持续使用与反馈。</p></div>`).join('')}<div class="panel"><h3 style="margin:0 0 8px;color:#f5d49b">马克思最后的叮嘱</h3><p>“别把一种能力误当成必须履行的义务。我们谈的是条件与可能性，而不是给你分配命运。”</p></div><button class="primary-btn full" data-act="graph">梦醒，展开全景图 →</button>${footer()}<p class="miniremark">教学性示意分析；并非经验证的现实行动方案或政治风险评估。</p></section>`}
function graph(){const work=state.resultChoices[0]||WORKS[0],map={position:['个人与集体条件',summaryLine()],work:[work[1],`这是可能的一种工作形式。它需要的能力、时间和协作条件，不能只由身份标签推断。`],front:[work[3],`“${work[1]}”可能与这些战线相关，但不同工作的边界并非截然分开。`],outcome:[work[4],`可能产生这样的直接成果；有活动不等于必定有成果。`],accum:['长期力量积累','成果只有经过保存、吸收、复用与集体协作，才可能逐渐变成较稳定的能力。']};return `<section class="screen"><div class="section-kicker">第四幕 · 机关背后的结构</div><h2 class="subheading center">革命实践关系图</h2><p class="small center">神殿像纸板舞台一样折叠起来。人偶的脚步声渐渐消失。留下来的，是可以被拆开研究的关系。</p><div class="panel"><div class="graph">${Object.entries(map).map(([key,v],i)=>`${i?'<div class="graph-line"></div>':''}<button data-node="${key}" class="${state.detail===key?'on':''}"><strong>${safe(v[0])}</strong><small>${safe(['主体与条件','工作','战线','直接成果','持续积累'][i])}</small></button>`).join('')}</div><div class="detail" aria-live="polite">${safe(map[state.detail]?.[1]||map.work[1])}</div></div><div class="section-kicker">假如只改变社会环境……</div><p class="small">其他回答不变，只切换一个概括的环境条件，比较解释如何变化。</p><div class="compare-tabs"><button data-whatif="same" class="${state.whatif==='same'?'on':''}">你的原始回答</button><button data-whatif="open" class="${state.whatif==='open'?'on':''}">假想：表达空间更广</button><button data-whatif="restrict" class="${state.whatif==='restrict'?'on':''}">假想：限制更严格</button></div><div class="detail" aria-live="polite">${safe(envDescription(state.whatif))}</div><p class="footnote" style="margin-top:15px">这是帮助理解理论关系的反事实对照，不能代替具体社会研究或风险判断。</p><button class="secondary-btn full" data-act="result">回看导师建议</button><button class="primary-btn full" data-act="restart">带着问题，再做一场梦 ↺</button><p class="center small" style="margin:24px 0 12px">接下来，该由你自己观察现实了。</p></section>`}
function draw(){app.innerHTML=state.screen==='home'?home():state.screen==='avatar'?avatarScreen():state.screen==='intro'?intro():state.screen==='question'?qScreen():state.screen==='result'?result():graph();if(state.screen==='avatar')installSketch()}
function baseSketch(){const c=document.getElementById('sketch');if(!c)return;const x=c.getContext('2d');x.fillStyle='#ead7b1';x.fillRect(0,0,300,300);x.strokeStyle='#927656';x.lineWidth=1;x.strokeRect(7,7,286,286);x.strokeStyle='#413329';x.lineWidth=4;x.lineCap='round';x.beginPath();x.arc(150,66,32,0,Math.PI*2);x.moveTo(150,98);x.lineTo(150,195);x.moveTo(150,130);x.lineTo(95,168);x.moveTo(150,130);x.lineTo(205,168);x.moveTo(150,195);x.lineTo(110,270);x.moveTo(150,195);x.lineTo(193,270);x.stroke();x.fillStyle='#776247';x.font='12px Georgia';x.fillText('自画像 · 无论如何都像你',50,21)}
function installSketch(){const c=document.getElementById('sketch'),ctx=c.getContext('2d');if(state.sketch){const im=new Image;im.onload=()=>ctx.drawImage(im,0,0);im.src=state.sketch}else{baseSketch();state.sketch=c.toDataURL('image/png')}let touching=false,last=null;const undo=[];const point=e=>{const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)*300/b.width,y:(e.clientY-b.top)*300/b.height}};c.addEventListener('pointerdown',e=>{touching=true;undo.push(c.toDataURL('image/png'));if(undo.length>30)undo.shift();c.setPointerCapture(e.pointerId);last=point(e);ctx.beginPath();ctx.fillStyle=state.color;ctx.arc(last.x,last.y,state.brush/2,0,2*Math.PI);ctx.fill()});c.addEventListener('pointermove',e=>{if(!touching)return;const p=point(e);ctx.strokeStyle=state.color;ctx.lineWidth=state.brush;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});for(const type of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(type,()=>{if(touching){touching=false;state.sketch=c.toDataURL('image/png')}});state.undoSketch=()=>{const last=undo.pop();if(!last)return;const im=new Image;im.onload=()=>{ctx.clearRect(0,0,300,300);ctx.drawImage(im,0,0);state.sketch=c.toDataURL('image/png')};im.src=last}}
app.addEventListener('input',e=>{if(e.target.id==='avatar-name')state.name=e.target.value;if(e.target.id==='avatar-role')state.role=e.target.value});
app.addEventListener('click',e=>{
const col=e.target.closest('[data-color]');if(col){state.color=col.dataset.color;document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active',b.dataset.color===state.color));return}
const cat=e.target.closest('[data-category]');if(cat){state.category=cat.dataset.category;state.cursor=0;sound();draw();return}
const rr=e.target.closest('[data-rot]');if(rr){rotate(Number(rr.dataset.rot));return}
const opt=e.target.closest('[data-opt]');if(opt){if(state.rolling)return;const q=Q[state.q];if(!q.multi){answer(opt.dataset.opt);return}answer(opt.dataset.opt);return}
const node=e.target.closest('[data-node]');if(node){state.detail=node.dataset.node;draw();return}
const wt=e.target.closest('[data-whatif]');if(wt){state.whatif=wt.dataset.whatif;draw();sound();return}
const b=e.target.closest('[data-act]');if(!b)return;
switch(b.dataset.act){case'avatar':setScreen('avatar');break;case'finishAvatar':{const c=document.getElementById('sketch');if(c)state.avatar=c.toDataURL('image/png');const dest=state.returnTo||'intro';state.returnTo=null;setScreen(dest);sound('bell');break}case'skipAvatar':{const dest=state.returnTo||'intro';state.returnTo=null;setScreen(dest);break}case'begin':state.animateEnter=true;setScreen('question');sound();setTimeout(()=>{state.animateEnter=false},reduced()?1:600);break;case'advance':next();break;case'confirmMulti':finishMulti();break;case'skipMulti':state.selectedMulti[Q[state.q].key]=[];finishMulti(true);break;case'edit':state.returnTo=state.screen;setScreen('avatar');break;case'undo':state.undoSketch?.();break;case'erase':state.color='#ead7b1';document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));break;case'resetSketch':{const c=document.getElementById('sketch');baseSketch();state.sketch=c.toDataURL('image/png');break}case'graph':state.detail='work';state.whatif='same';setScreen('graph');sound('bell');break;case'result':setScreen('result');break;case'restart':state.q=0;state.answers={};state.selectedMulti={};state.replyReady=false;state.category='all';state.cursor=0;state.resultChoices=[];setScreen('home');break;}
});
document.getElementById('sound').addEventListener('click',e=>{state.sound=!state.sound;e.currentTarget.textContent=state.sound?'♪':'♫';e.currentTarget.setAttribute('aria-label',state.sound?'关闭音效':'开启音效');if(state.sound)sound('bell')});
document.getElementById('restart').addEventListener('click',()=>{state.q=0;state.answers={};state.selectedMulti={};state.replyReady=false;state.category='all';state.cursor=0;state.resultChoices=[];setScreen('home')});
// 编辑头像时保留当前问答进度：编辑完成返回原页，不重置任何答案。

draw();
})();
</script>
